# linux-privacy-switch — device configuration
#
# Each section defines a laptop profile.
# The match_* fields are used for automatic model detection.
# Run: sudo python3 src/privacy-switch.py --detect
# to get the values for your laptop.

# ──────────────────────────────────────────────────────────────────────────────
# Lenovo Legion 5 15IRX10 (83LY)
# Slider: physical slider on the lid, red=off, green=on
# ──────────────────────────────────────────────────────────────────────────────
[lenovo-legion-5-15irx10]
match_sys_vendor       = LENOVO
match_product_name     = 83LY
input_device_name      = Ideapad extra buttons
key_code               = 240
alsa_card              = 1
alsa_control           = Capture
camera_power_path      = /sys/bus/platform/drivers/ideapad_acpi/VPC2004:00/camera_power
has_hw_camera_kill     = true
sync_camera            = true
sync_mic               = true
description            = Lenovo Legion 5 15IRX10 — physical slider on the chassis

# ──────────────────────────────────────────────────────────────────────────────
# Lenovo Legion 5 15ACH6H / 5i Gen 6 (similar series)
# Verify key_code with: sudo python3 src/privacy-switch.py --detect
# ──────────────────────────────────────────────────────────────────────────────
[lenovo-legion-5-gen6]
match_sys_vendor       = LENOVO
match_product_name     = 82JU
input_device_name      = Ideapad extra buttons
key_code               = 240
alsa_card              = 0
alsa_control           = Capture
camera_power_path      = /sys/bus/platform/drivers/ideapad_acpi/VPC2004:00/camera_power
has_hw_camera_kill     = true
sync_camera            = true
sync_mic               = true
description            = Lenovo Legion 5 Gen 6 (AMD)

# ──────────────────────────────────────────────────────────────────────────────
# Lenovo IdeaPad 5 — Fn+F9 button (KEY_CAMERA, code 0x212)
# ──────────────────────────────────────────────────────────────────────────────
[lenovo-ideapad-5]
match_sys_vendor       = LENOVO
match_product_name     = IdeaPad 5
input_device_name      = Ideapad extra buttons
key_code               = 530
alsa_card              = 0
alsa_control           = Capture
camera_power_path      = /sys/bus/platform/drivers/ideapad_acpi/VPC2004:00/camera_power
has_hw_camera_kill     = false
sync_camera            = true
sync_mic               = true
description            = Lenovo IdeaPad 5 — Fn+F9 button (software-only, no sensor disconnect)

# ──────────────────────────────────────────────────────────────────────────────
# Template for adding a new device
# Copy this section, fill in the fields, and submit a PR.
# ──────────────────────────────────────────────────────────────────────────────
# [my-laptop-model]
# match_sys_vendor       = VENDOR
# match_product_name     = MODEL_NAME
# input_device_name      = <device name from: python3 src/privacy-switch.py --detect>
# key_code               = <key code from --monitor>
# alsa_card              = 0
# alsa_control           = Capture
# camera_power_path      = (optional)
# has_hw_camera_kill     = false  # true if slider physically cuts camera sensor power
# sync_camera            = true   # write camera_power sysfs on toggle
# sync_mic               = true   # mute/unmute mic (ALSA + PipeWire) on toggle
# nonzero_threshold      = 3.0    # % nonzero bytes; set by --calibrate
# description            = Short description
