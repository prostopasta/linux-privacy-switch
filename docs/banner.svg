<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="100%" style="stop-color:#27ae60"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="180" rx="12" fill="url(#bg)"/>

  <!-- Accent bar -->
  <rect x="0" y="156" width="880" height="4" rx="0" fill="url(#accent)"/>
  <rect x="0" y="156" width="880" height="4" rx="2" fill="url(#accent)"/>

  <!-- Camera OFF icon (left) -->
  <g transform="translate(44, 40)">
    <rect x="2" y="7" width="20" height="14" rx="2" fill="#e74c3c" opacity="0.9"/>
    <circle cx="12" cy="14" r="4" fill="#c0392b"/>
    <circle cx="12" cy="14" r="2.5" fill="#a93226"/>
    <rect x="8" y="4" width="5" height="4" rx="1" fill="#e74c3c" opacity="0.9"/>
    <rect x="15" y="5" width="3" height="2" rx="0.5" fill="#c0392b"/>
    <line x1="2" y1="4" x2="22" y2="24" stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="22" y1="4" x2="2" y2="24" stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Arrow -->
  <text x="110" y="58" font-family="monospace" font-size="22" fill="#7f8c8d">→</text>

  <!-- Camera ON icon -->
  <g transform="translate(144, 40)">
    <rect x="2" y="7" width="20" height="14" rx="2" fill="#27ae60" opacity="0.9"/>
    <circle cx="12" cy="14" r="4" fill="#1e8449"/>
    <circle cx="12" cy="14" r="2.5" fill="#1a5e37"/>
    <rect x="8" y="4" width="5" height="4" rx="1" fill="#27ae60" opacity="0.9"/>
    <rect x="15" y="5" width="3" height="2" rx="0.5" fill="#1e8449"/>
  </g>

  <!-- Vertical separator -->
  <line x1="215" y1="30" x2="215" y2="150" stroke="#2c3e50" stroke-width="1.5"/>

  <!-- Title -->
  <text x="240" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="32" font-weight="700" fill="#ecf0f1" letter-spacing="-0.5">
    linux-privacy-switch
  </text>

  <!-- Subtitle -->
  <text x="241" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" fill="#95a5a6" letter-spacing="0.2">
    Hardware camera &amp; microphone privacy switch for Linux
  </text>

  <!-- Tags -->
  <g transform="translate(241, 118)">
    <!-- systemd -->
    <rect x="0" y="0" width="72" height="22" rx="4" fill="#2c3e50"/>
    <text x="8" y="15" font-family="monospace" font-size="11" fill="#3498db">systemd</text>

    <!-- ALSA + PipeWire -->
    <rect x="80" y="0" width="112" height="22" rx="4" fill="#2c3e50"/>
    <text x="88" y="15" font-family="monospace" font-size="11" fill="#9b59b6">ALSA + PipeWire</text>

    <!-- GTK tray -->
    <rect x="200" y="0" width="76" height="22" rx="4" fill="#2c3e50"/>
    <text x="208" y="15" font-family="monospace" font-size="11" fill="#e67e22">GTK tray</text>

    <!-- Lenovo Legion -->
    <rect x="284" y="0" width="110" height="22" rx="4" fill="#2c3e50"/>
    <text x="292" y="15" font-family="monospace" font-size="11" fill="#e74c3c">Lenovo Legion</text>
  </g>

  <!-- Switch illustration (right side) -->
  <g transform="translate(720, 50)">
    <!-- Switch track OFF -->
    <rect x="0" y="20" width="60" height="28" rx="14" fill="#2c3e50"/>
    <circle cx="16" cy="34" r="11" fill="#e74c3c"/>
    <text x="6" y="39" font-family="monospace" font-size="10" fill="white" font-weight="bold">OFF</text>

    <!-- Arrow down -->
    <text x="26" y="65" font-family="monospace" font-size="14" fill="#7f8c8d">↓</text>

    <!-- Switch track ON -->
    <rect x="0" y="70" width="60" height="28" rx="14" fill="#1e3a2e"/>
    <circle cx="44" cy="84" r="11" fill="#27ae60"/>
    <text x="30" y="89" font-family="monospace" font-size="10" fill="white" font-weight="bold">ON</text>
  </g>
</svg>
